services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ecommerce-assassins_db
      MARIADB_USER: ${DB_USERNAME:-ecommerce_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:-local-demo-password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-demo-root-password}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/data_videogames.sql:/docker-entrypoint-initdb.d/02-data-videogames.sql:ro
      - ./db/data_users.sql:/docker-entrypoint-initdb.d/03-data-users.sql:ro
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ecommerce-assassins_db
      DB_PORT: "3306"
      DB_USERNAME: ${DB_USERNAME:-ecommerce_app}
      DB_PASSWORD: ${DB_PASSWORD:-local-demo-password}
    ports:
      - "${APP_PORT:-8080}:8080"
volumes:
  mariadb_data:
