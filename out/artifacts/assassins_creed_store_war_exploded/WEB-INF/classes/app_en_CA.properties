#======================================
#1 assassins creed I
#======================================
PTitleAC1 = assassins creed I
DescriptionAC1 = <strong>Assassin's Creed</strong>, released in November 2007 by Ubisoft, is an open\u2011world action\u2011adventure game retracing the events of the Third Crusade in the Holy Land in 1191. The player mainly controls Alta\u00efr Ibn\u2011La'Ahad, a member of the Assassin Brotherhood, whose genetic memories are simulated by a machine called the Animus for Desmond Miles, a 21st\u2011century protagonist kidnapped by Abstergo Industries.

#======================================
#2 assassins creed II
#======================================
PTitleAC2 = assassins creed II
DescriptionAC2 = <strong>Assassin's Creed II</strong>, released in November 2009 by Ubisoft, is an open\u2011world action\u2011adventure game set in the heart of the Italian Renaissance. You play as Ezio Auditore da Firenze, a young noble whose life is shattered after the betrayal of his family. Guided by the Assassin Brotherhood, Ezio embarks on a long journey of vengeance and discovery through Florence, Venice, and other iconic cities. Through the Animus, Desmond Miles relives these genetic memories to uncover Abstergo\u2019s secrets and continue the modern\u2011day fight against the Templars.

#======================================
#3 assassins creed brotherhood
#======================================
PTitleACB = assassins creed brotherhood
DescriptionACB = <strong>Assassin's Creed Brotherhood</strong>, released in November 2010 by Ubisoft, is an open\u2011world action\u2011adventure game that continues Ezio Auditore\u2019s story. Now a Master Assassin, Ezio leads the fight against the Templars in Rome, a vast city he must liberate district by district. The player develops the Brotherhood by recruiting and training new Assassins while confronting the powerful Borgia family. Through the Animus, Desmond Miles relives these memories to uncover crucial clues in his modern\u2011day battle against Abstergo and prevent a new global catastrophe.

#======================================
#4 assassins creed revelations
#======================================
PTitleACR = assassins creed revelations
DescriptionACR = <strong>Assassin's Creed Revelations</strong>, released in November 2011 by Ubisoft, is an open\u2011world action\u2011adventure game concluding Ezio Auditore\u2019s saga. Now Mentor of the Brotherhood, Ezio travels to Constantinople to uncover secrets left by Alta\u00efr and discover the truth behind the keys to the Masyaf library. Amid political conflicts, rival factions, and urban exploration, the adventure blends stealth, parkour, and new mechanics like the hookblade. Through the Animus, Desmond Miles relives these memories to rebuild his fragmented mind and find a way to stop the catastrophe foretold by the First Civilization.

#======================================
#5 assassins creed III
#======================================
PTitleAC3 = assassins creed III
DescriptionAC3 = <strong>Assassin's Creed III</strong>, released in October 2012 by Ubisoft, is an open\u2011world action\u2011adventure game set during the American Revolution. You play as Ratonhnhak\u00e9:ton, known as Connor, a young warrior of Mohawk and British descent caught in the conflict between Assassins and Templars. Through the Animus, Desmond Miles relives these genetic memories to uncover essential artifacts and prevent an imminent global catastrophe. Featuring historical battles, vast wilderness exploration, and naval combat, this episode marks a major turning point in the saga.

#======================================
#6 assassins creed blackflag
#======================================
PTitleACBF = assassins creed blackflag
DescriptionACBF = <strong>Assassin's Creed IV: Black Flag</strong>, released in October 2013 by Ubisoft, is an open\u2011world action\u2011adventure game set during the Golden Age of Piracy in the early 18th century. You play as Edward Kenway, an ambitious pirate drawn into the conflict between Assassins and Templars. With naval exploration, boarding, treasure hunting, and sea battles, Edward sails across the Caribbean while uncovering the secrets of the Observatory. Through the Animus, Desmond Miles is replaced by a new Abstergo employee tasked with exploring Edward\u2019s memories to serve modern\u2011day Templar interests.

#======================================
#7 assassins creed rogue
#======================================
PTitleACRG = assassins creed rogue
DescriptionACRG = <strong>Assassin's Creed Rogue</strong>, released in November 2014 by Ubisoft, is an open\u2011world action\u2011adventure game telling the story of Shay Patrick Cormac, an Assassin who ultimately betrays the Brotherhood. After a tragic mission, Shay questions the Assassins\u2019 methods and joins the Templars, becoming one of their most formidable hunters. The adventure spans the North Atlantic, the Appalachians, and New York, mixing naval exploration, sea combat, and land infiltration. Through the Animus, Abstergo employees analyze Shay\u2019s memories to better understand the downfall of several Assassins and strengthen their modern\u2011day fight.

#======================================
#8 assassins creed unity
#======================================
PTitleACU = assassins creed unity
DescriptionACU = <strong>Assassin's Creed Unity</strong>, released in November 2014 by Ubisoft, is an open\u2011world action\u2011adventure game set in Paris during the French Revolution. You play as Arno Dorian, a young man seeking redemption and uncovering conspiracies tearing the capital apart. With refined parkour, stealth, and exploration of iconic monuments, the adventure emphasizes movement precision and Assassin customization. Through the Animus, Brotherhood agents analyze Arno\u2019s memories to thwart Abstergo\u2019s manipulations and reveal new fragments of Isu history.

#======================================
#9 assassins creed syndicate
#======================================
PTitleACSY = assassins creed syndicate
DescriptionACSY = <strong>Assassin's Creed Syndicate</strong>, released in October 2015 by Ubisoft, is an open\u2011world action\u2011adventure game set in industrial London in 1868. The story follows twins Jacob and Evie Frye, two Assassins with opposite methods fighting to free the city from Templar control. With street combat, infiltration, carriage chases, and exploration of iconic districts, the adventure emphasizes verticality thanks to the grappling hook. Through the Animus, a modern\u2011day Brotherhood agent explores these memories to uncover new Isu artifacts and counter Abstergo\u2019s plans.

#======================================
#10 assassins creed origins
#======================================
PTitleACOR = assassins creed origins
DescriptionACOR = <strong>Assassin's Creed Origins</strong>, released in October 2017 by Ubisoft, is an open\u2011world action\u2011RPG retracing the birth of the Assassin Brotherhood in ancient Egypt. You play as Bayek of Siwa, a Medjay whose personal quest for justice leads him to confront the Order of the Ancients, precursor to the Templars. From the pyramids of Giza to the Sinai deserts, the adventure blends exploration, dynamic combat, and archaeological discovery. Through the Animus, archaeologist Layla Hassan analyzes Bayek\u2019s memories to understand the origins of the millennia\u2011long conflict and pursue her mission against Abstergo.

#======================================
#11 assassins creed odyssey
#======================================
PTitleACOD = assassins creed odyssey
DescriptionACOD = <strong>Assassin's Creed Odyssey</strong>, released in October 2018 by Ubisoft, is an open\u2011world action\u2011RPG set in ancient Greece during the Peloponnesian War. You play as Alexios or Kassandra, a Spartan mercenary whose destiny is tied to a mysterious bloodline and an Isu artifact coveted by the Cult of Kosmos. With island exploration, naval battles, narrative choices, and mythical creature encounters, the adventure offers immense freedom. Through the Animus, Layla Hassan explores these memories to uncover new secrets about the First Civilization and counter Abstergo\u2019s modern\u2011day plans.

#======================================
#12 assassins creed valhalla
#======================================
PTitleACV = assassins creed valhalla
DescriptionACV = <strong>Assassin's Creed Valhalla</strong>, released in November 2020 by Ubisoft, is an open\u2011world action\u2011RPG set in 9th\u2011century England during the Viking Age. You play as Eivor, a warrior of the Raven Clan leading their people to new lands while facing Saxon kingdoms, secret cults, and mythological forces. With raids, exploration, settlement building, and brutal combat, the adventure blends historical realism with Norse legends. Through the Animus, Layla Hassan explores Eivor\u2019s memories to uncover First Civilization mysteries and continue the modern\u2011day fight against Abstergo.

#======================================
#13 assassins creed mirage
#======================================
PTitleACM = assassins creed mirage
DescriptionACM = <strong>Assassin's Creed Mirage</strong>, released in October 2023 by Ubisoft, is an action\u2011adventure game returning to the franchise\u2019s roots. You play as Basim Ibn Ishaq, a young thief from Baghdad who joins the Assassin Brotherhood to escape his past and discover his true nature. Set in the capital of the Islamic Golden Age, the adventure focuses on stealth, parkour, and targeted assassinations. Through the Animus, a new user explores Basim\u2019s memories to uncover mysteries surrounding his link to the Isu and Abstergo\u2019s modern\u2011day schemes.

#======================================
#14 assassins creed shadows
#======================================
PTitleACSH = assassins creed shadows
DescriptionACSH = <strong>Assassin's Creed Shadows</strong>, planned for November 2024 by Ubisoft, is an open\u2011world action\u2011adventure game set in Sengoku\u2011era Japan, a time of civil wars and power struggles. The story follows two protagonists: Naoe, an agile and stealthy kunoichi shinobi, and Yasuke, an African samurai inspired by a real historical figure. The player alternates between infiltration, combat, and exploration of war\u2011torn Japanese provinces. Through the Animus, a new user dives into these memories to uncover secrets surrounding rival clans, Isu artifacts, and Abstergo\u2019s modern\u2011day manipulations.



