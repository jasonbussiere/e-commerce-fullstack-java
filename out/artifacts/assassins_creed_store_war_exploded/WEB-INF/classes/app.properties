#======================================
#1 assassins creed I
#======================================
PTitleAC1 = assassins creed I
DescriptionAC1 = <strong>Assassin's Creed</strong>, sorti en novembre 2007 par Ubisoft, est un jeu d'action\u2011aventure en monde ouvert qui retrace les \u00e9v\u00e9nements de la Troisi\u00e8me Croisade en Terre sainte en 1191. Le joueur contr\u00f4le principalement Alta\u00efr Ibn\u2011La'Ahad, un membre de la fratrie des Assassins, dont les souvenirs g\u00e9n\u00e9tiques sont simul\u00e9s par une machine appel\u00e9e Animus pour Desmond Miles, un protagoniste du XXIe si\u00e8cle kidnapp\u00e9 par Abstergo Industries.

#======================================
#2 assassins creed II
#======================================
PTitleAC2 = assassins creed II
DescriptionAC2 = <strong>Assassin's Creed II</strong>, sorti en novembre 2009 par Ubisoft, est un jeu d'action\u2011aventure en monde ouvert qui transporte le joueur au c\u0153ur de la Renaissance italienne. On y incarne Ezio Auditore da Firenze, un jeune noble dont la vie bascule apr\u00e8s la trahison de sa famille. Guid\u00e9 par la confr\u00e9rie des Assassins, Ezio entreprend un long voyage de vengeance et de d\u00e9couverte \u00e0 travers Florence, Venise et d\u2019autres cit\u00e9s embl\u00e9matiques. Gr\u00e2ce \u00e0 l\u2019Animus, Desmond Miles revit ces souvenirs g\u00e9n\u00e9tiques afin de percer les secrets d\u2019Abstergo et de poursuivre la lutte moderne contre les Templiers.

#======================================
#3 assassins creed brotherhood
#======================================
PTitleACB = assassins creed brotherhood
DescriptionACB = <strong>Assassin's Creed Brotherhood</strong>, sorti en novembre 2010 par Ubisoft, est un jeu d'action\u2011aventure en monde ouvert qui poursuit directement l\u2019histoire d\u2019Ezio Auditore. D\u00e9sormais Ma\u00eetre Assassin, Ezio m\u00e8ne la lutte contre les Templiers au c\u0153ur de Rome, une ville immense qu\u2019il doit lib\u00e9rer quartier par quartier. Le joueur d\u00e9veloppe la confr\u00e9rie en recrutant et en formant de nouveaux Assassins, tout en affrontant la puissante famille Borgia. \u00c0 travers l\u2019Animus, Desmond Miles revit ces souvenirs pour d\u00e9couvrir des indices essentiels dans sa bataille moderne contre Abstergo et emp\u00eacher une nouvelle catastrophe mondiale.

#======================================
#4 assassins creed revelations
#======================================
PTitleACR = assassins creed revelations
DescriptionACR = <strong>Assassin's Creed Revelations</strong>, sorti en novembre 2011 par Ubisoft, est un jeu d\u2019action\u2011aventure en monde ouvert qui conclut l\u2019\u00e9pop\u00e9e d\u2019Ezio Auditore. D\u00e9sormais Mentor de la Confr\u00e9rie, Ezio voyage jusqu\u2019\u00e0 Constantinople pour percer les secrets laiss\u00e9s par Alta\u00efr et d\u00e9couvrir la v\u00e9rit\u00e9 derri\u00e8re les cl\u00e9s de la biblioth\u00e8que de Masyaf. Entre conflits politiques, factions rivales et exploration urbaine, l\u2019aventure m\u00eale infiltration, parkour et nouvelles m\u00e9caniques comme le crochet\u2011lame. \u00c0 travers l\u2019Animus, Desmond Miles revit ces souvenirs pour reconstruire son esprit fragment\u00e9 et trouver un moyen d\u2019emp\u00eacher la catastrophe annonc\u00e9e par la Premi\u00e8re Civilisation.

#======================================
#5 assassins creed III
#======================================
PTitleAC3 = assassins creed III
DescriptionAC3 = <strong>Assassin's Creed III</strong>, sorti en octobre 2012 par Ubisoft, est un jeu d'action\u2011aventure en monde ouvert qui plonge le joueur au c\u0153ur de la R\u00e9volution am\u00e9ricaine. On y incarne Ratonhnhak\u00e9:ton, connu sous le nom de Connor, un jeune guerrier d\u2019origine mohawk et britannique qui se retrouve au centre du conflit entre Assassins et Templiers. \u00c0 travers l\u2019Animus, Desmond Miles revit ces souvenirs g\u00e9n\u00e9tiques afin de d\u00e9couvrir des artefacts essentiels et emp\u00eacher une catastrophe mondiale imminente. Entre batailles historiques, exploration de vastes territoires sauvages et affrontements navals, cet \u00e9pisode marque un tournant majeur dans la saga.

#======================================
#6 assassins creed blackflag
#======================================
PTitleACBF = assassins creed blackflag
DescriptionACBF = <strong>Assassin's Creed IV: Black Flag</strong>, sorti en octobre 2013 par Ubisoft, est un jeu d'action\u2011aventure en monde ouvert qui plonge le joueur dans l\u2019\u00e2ge d\u2019or de la piraterie au d\u00e9but du XVIII\u1d49 si\u00e8cle. On y incarne Edward Kenway, un pirate ambitieux qui se retrouve m\u00eal\u00e9 malgr\u00e9 lui au conflit entre Assassins et Templiers. Entre exploration navale, abordages, chasse au tr\u00e9sor et batailles en mer, Edward navigue \u00e0 travers les Cara\u00efbes tout en d\u00e9couvrant les secrets de l\u2019Observatoire. \u00c0 travers l\u2019Animus, Desmond Miles laisse place \u00e0 un nouvel employ\u00e9 d\u2019Abstergo, charg\u00e9 d\u2019explorer les souvenirs d\u2019Edward pour servir les int\u00e9r\u00eats modernes des Templiers.

#======================================
#7 assassins creed rogue
#======================================
PTitleACRG = assassins creed rogue
DescriptionACRG = <strong>Assassin's Creed Rogue</strong>, sorti en novembre 2014 par Ubisoft, est un jeu d\u2019action\u2011aventure en monde ouvert qui raconte l\u2019histoire de Shay Patrick Cormac, un Assassin qui finit par trahir la Confr\u00e9rie. Apr\u00e8s une mission tragique, Shay remet en question les m\u00e9thodes des Assassins et rejoint les Templiers, devenant l\u2019un de leurs chasseurs les plus redoutables. L\u2019aventure se d\u00e9roule entre l\u2019Atlantique Nord, les Appalaches et New York, m\u00ealant exploration navale, combats en mer et infiltration terrestre. \u00c0 travers l\u2019Animus, les employ\u00e9s d\u2019Abstergo analysent les souvenirs de Shay pour mieux comprendre la chute de plusieurs Assassins et renforcer leur lutte moderne contre leurs ennemis.

#======================================
#8 assassins creed unity
#======================================
PTitleACU = assassins creed unity
DescriptionACU = <strong>Assassin's Creed Unity</strong>, sorti en novembre 2014 par Ubisoft, est un jeu d\u2019action\u2011aventure en monde ouvert qui transporte le joueur au c\u0153ur de Paris pendant la R\u00e9volution fran\u00e7aise. On y incarne Arno Dorian, un jeune homme cherchant \u00e0 expier son pass\u00e9 et \u00e0 d\u00e9voiler les complots qui d\u00e9chirent la capitale. Entre infiltration, parkour repens\u00e9 et exploration de monuments embl\u00e9matiques, l\u2019aventure met l\u2019accent sur la pr\u00e9cision des d\u00e9placements et la personnalisation de l\u2019Assassin. \u00c0 travers l\u2019Animus, les agents de la Confr\u00e9rie analysent les souvenirs d\u2019Arno pour d\u00e9jouer les manipulations d\u2019Abstergo et r\u00e9v\u00e9ler de nouveaux fragments de l\u2019histoire Isu.

#======================================
#9 assassins creed syndicate
#======================================
PTitleACSY = assassins creed syndicate
DescriptionACSY = <strong>Assassin's Creed Syndicate</strong>, sorti en octobre 2015 par Ubisoft, est un jeu d\u2019action\u2011aventure en monde ouvert qui plonge le joueur dans le Londres industriel de 1868, en pleine r\u00e9volution industrielle. L\u2019histoire suit les jumeaux Jacob et Evie Frye, deux Assassins aux m\u00e9thodes oppos\u00e9es qui luttent pour lib\u00e9rer la ville de l\u2019emprise des Templiers et de leurs gangs. Entre combats de rue, infiltration, courses de fiacres et exploration de quartiers embl\u00e9matiques, l\u2019aventure met l\u2019accent sur la verticalit\u00e9 gr\u00e2ce au grappin. \u00c0 travers l\u2019Animus, l\u2019agent moderne de la Confr\u00e9rie explore ces souvenirs pour d\u00e9couvrir de nouveaux artefacts Isu et contrer les plans d\u2019Abstergo dans le pr\u00e9sent.
#======================================
#10 assassins creed origins
#======================================
PTitleACOR = assassins creed origins
DescriptionACOR = <strong>Assassin's Creed Origins</strong>, sorti en octobre 2017 par Ubisoft, est un jeu d\u2019action\u2011RPG en monde ouvert qui retrace la naissance de la Confr\u00e9rie des Assassins dans l\u2019\u00c9gypte antique. Le joueur incarne Bayek de Siwa, un Medja\u00ff dont la qu\u00eate personnelle de justice l\u2019am\u00e8ne \u00e0 affronter l\u2019Ordre des Anciens, pr\u00e9curseur des Templiers. Des pyramides de Gizeh aux d\u00e9serts du Sina\u00ef, l\u2019aventure m\u00eale exploration, combats dynamiques et d\u00e9couvertes arch\u00e9ologiques. \u00c0 travers l\u2019Animus, l\u2019arch\u00e9ologue Layla Hassan analyse les souvenirs de Bayek afin de comprendre les origines de la lutte mill\u00e9naire entre Assassins et Templiers et de poursuivre sa mission contre Abstergo dans le pr\u00e9sent.

#======================================
#11 assassins creed odyssey
#======================================
PTitleACOD = assassins creed odyssey
DescriptionACOD = <strong>Assassin's Creed Odyssey</strong>, sorti en octobre 2018 par Ubisoft, est un jeu d\u2019action\u2011RPG en monde ouvert qui transporte le joueur au c\u0153ur de la Gr\u00e8ce antique pendant la guerre du P\u00e9loponn\u00e8se. On y incarne Alexios ou Kassandra, un mercenaire spartiate dont le destin est li\u00e9 \u00e0 une myst\u00e9rieuse lign\u00e9e et \u00e0 un artefact Isu convoit\u00e9 par les Cultistes du Cosmos. Entre exploration d\u2019\u00eeles mythiques, batailles navales, choix narratifs et affrontements contre des cr\u00e9atures l\u00e9gendaires, l\u2019aventure offre une libert\u00e9 immense. \u00c0 travers l\u2019Animus, l\u2019arch\u00e9ologue Layla Hassan explore ces souvenirs pour d\u00e9voiler de nouveaux secrets sur la Premi\u00e8re Civilisation et contrer les plans d\u2019Abstergo dans le pr\u00e9sent.
#======================================
#12 assassins creed valhalla
#======================================
PTitleACV = assassins creed valhalla
DescriptionACV = <strong>Assassin's Creed Valhalla</strong>, sorti en novembre 2020 par Ubisoft, est un jeu d\u2019action\u2011RPG en monde ouvert qui plonge le joueur dans l\u2019Angleterre du IX\u1d49 si\u00e8cle, en pleine \u00e8re viking. On y incarne Eivor, un guerrier ou une guerri\u00e8re du clan des Corbeaux, qui m\u00e8ne son peuple vers de nouvelles terres tout en affrontant royaumes saxons, cultes secrets et forces mythologiques. Entre raids, exploration, construction de colonie et combats brutaux, l\u2019aventure m\u00eale r\u00e9alisme historique et l\u00e9gendes nordiques. \u00c0 travers l\u2019Animus, Layla Hassan explore les souvenirs d\u2019Eivor afin de percer les myst\u00e8res de la Premi\u00e8re Civilisation et de poursuivre la lutte moderne contre Abstergo.

#======================================
#13 assassins creed mirage
#======================================
PTitleACM = assassins creed mirage
DescriptionACM = <strong>Assassin's Creed Mirage</strong>, sorti en octobre 2023 par Ubisoft, est un jeu d\u2019action\u2011aventure qui marque un retour aux racines de la franchise. Le joueur incarne Basim Ibn Ishaq, un jeune voleur de Bagdad qui rejoint la Confr\u00e9rie des Assassins pour \u00e9chapper \u00e0 son pass\u00e9 et d\u00e9couvrir sa v\u00e9ritable nature. L\u2019aventure se d\u00e9roule dans la capitale de l\u2019\u00e2ge d\u2019or islamique, une ville dense et vivante o\u00f9 l\u2019infiltration, le parkour et les assassinats cibl\u00e9s redeviennent centraux. \u00c0 travers l\u2019Animus, un nouvel utilisateur explore les souvenirs de Basim afin de percer les myst\u00e8res entourant son lien avec les entit\u00e9s Isu et les plans d\u2019Abstergo dans le pr\u00e9sent.
#======================================
#14 assassins creed shadows
#======================================
PTitleACSH = assassins creed shadows
DescriptionACSH = <strong>Assassin's Creed Shadows</strong>, pr\u00e9vu pour novembre 2024 par Ubisoft, est un jeu d\u2019action\u2011aventure en monde ouvert qui transporte le joueur dans le Japon de l\u2019\u00e9poque Sengoku, une \u00e8re marqu\u00e9e par les guerres civiles et les luttes de pouvoir. L\u2019histoire suit deux protagonistes : Naoe, une kunoichi shinobi agile et furtive, et Yasuke, un samoura\u00ef d\u2019origine africaine inspir\u00e9 d\u2019une figure historique r\u00e9elle. Le joueur alterne entre infiltration, combat et exploration de provinces japonaises en pleine tourmente. \u00c0 travers l\u2019Animus, un nouvel utilisateur plonge dans ces souvenirs afin de d\u00e9voiler les secrets entourant les clans rivaux, les artefacts Isu et les manipulations modernes d\u2019Abstergo.


